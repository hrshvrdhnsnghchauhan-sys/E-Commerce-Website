<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — KARTIFY</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-root"></div>

<div class="page-header">
  <div class="breadcrumb">
    <a href="index.html">Shop</a>
    <span class="breadcrumb-sep">/</span>
    <a href="cart.html">Cart</a>
    <span class="breadcrumb-sep">/</span>
    <span>Checkout</span>
  </div>
  <h1>CHECK<span>OUT</span></h1>
</div>

<div class="checkout-layout">

  <!-- CHECKOUT FORM -->
  <div class="checkout-form-section">

    <!-- Delivery Info -->
    <div class="form-section-title">DELIVERY INFO</div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">First Name *</label>
        <input type="text" class="form-input" id="fname" placeholder="Rahul" required>
      </div>
      <div class="form-group">
        <label class="form-label">Last Name *</label>
        <input type="text" class="form-input" id="lname" placeholder="Sharma" required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address *</label>
      <input type="email" class="form-input" id="email" placeholder="rahul@example.com" required>
    </div>

    <div class="form-group">
      <label class="form-label">Phone Number *</label>
      <input type="tel" class="form-input" id="phone" placeholder="+91 98765 43210" required>
    </div>

    <div class="form-group">
      <label class="form-label">Street Address *</label>
      <input type="text" class="form-input" id="address" placeholder="123, MG Road, Koregaon Park" required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">City *</label>
        <input type="text" class="form-input" id="city" placeholder="Pune" required>
      </div>
      <div class="form-group">
        <label class="form-label">PIN Code *</label>
        <input type="text" class="form-input" id="pin" placeholder="411001" required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">State *</label>
      <select class="form-input" id="state">
        <option value="">Select State</option>
        <option value="MH" selected>Maharashtra</option>
        <option value="DL">Delhi</option>
        <option value="KA">Karnataka</option>
        <option value="TN">Tamil Nadu</option>
        <option value="GJ">Gujarat</option>
        <option value="UP">Uttar Pradesh</option>
        <option value="WB">West Bengal</option>
        <option value="RJ">Rajasthan</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- Payment -->
    <div class="form-section-title" style="margin-top:36px">PAYMENT METHOD</div>

    <div class="payment-options" id="payment-options">
      <div class="pay-option selected" data-method="card" onclick="selectPay(this, 'card')">
        <div class="pay-radio checked" id="radio-card"></div>
        <span class="pay-label">Credit / Debit Card</span>
        <div class="pay-icons">
          <span class="pay-icon">VISA</span>
          <span class="pay-icon">MC</span>
          <span class="pay-icon">AMEX</span>
        </div>
      </div>
      <div class="pay-option" data-method="upi" onclick="selectPay(this, 'upi')">
        <div class="pay-radio" id="radio-upi"></div>
        <span class="pay-label">UPI</span>
        <div class="pay-icons">
          <span class="pay-icon">GPay</span>
          <span class="pay-icon">PhonePe</span>
        </div>
      </div>
      <div class="pay-option" data-method="cod" onclick="selectPay(this, 'cod')">
        <div class="pay-radio" id="radio-cod"></div>
        <span class="pay-label">Cash on Delivery</span>
        <div class="pay-icons"><span class="pay-icon">COD</span></div>
      </div>
      <div class="pay-option" data-method="netbanking" onclick="selectPay(this, 'netbanking')">
        <div class="pay-radio" id="radio-netbanking"></div>
        <span class="pay-label">Net Banking</span>
        <div class="pay-icons"><span class="pay-icon">Bank</span></div>
      </div>
    </div>

    <!-- Card Fields -->
    <div class="card-fields" id="card-fields">
      <div class="form-group">
        <label class="form-label">Card Number</label>
        <input type="text" class="form-input" id="card-num" placeholder="4242 4242 4242 4242"
          maxlength="19" oninput="formatCard(this)">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Expiry (MM/YY)</label>
          <input type="text" class="form-input" id="card-exp" placeholder="12/27" maxlength="5" oninput="formatExp(this)">
        </div>
        <div class="form-group">
          <label class="form-label">CVV</label>
          <input type="password" class="form-input" id="card-cvv" placeholder="•••" maxlength="4">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Cardholder Name</label>
        <input type="text" class="form-input" id="card-name" placeholder="RAHUL SHARMA">
      </div>
    </div>

    <!-- UPI Field -->
    <div class="card-fields" id="upi-fields" style="display:none">
      <div class="form-group">
        <label class="form-label">UPI ID</label>
        <input type="text" class="form-input" id="upi-id" placeholder="rahul@upi">
      </div>
    </div>

    <button class="place-order-btn" onclick="placeOrder()">PLACE ORDER →</button>

  </div>

  <!-- ORDER REVIEW -->
  <div class="order-summary">
    <div class="summary-card">
      <div class="summary-header">YOUR ORDER</div>
      <div class="summary-body" id="checkout-summary"></div>
    </div>
  </div>

</div>

<div id="footer-root"></div>

<script src="data.js"></script>
<script>
document.getElementById('navbar-root').innerHTML = renderNavbar('checkout');
document.getElementById('footer-root').innerHTML = renderFooter();

let selectedMethod = 'card';

function selectPay(el, method) {
  selectedMethod = method;
  document.querySelectorAll('.pay-option').forEach(o => {
    o.classList.remove('selected');
    o.querySelector('.pay-radio').classList.remove('checked');
  });
  el.classList.add('selected');
  el.querySelector('.pay-radio').classList.add('checked');

  document.getElementById('card-fields').style.display = method === 'card' ? 'block' : 'none';
  document.getElementById('upi-fields').style.display = method === 'upi' ? 'block' : 'none';
}

function formatCard(input) {
  let val = input.value.replace(/\D/g, '').substring(0, 16);
  input.value = val.match(/.{1,4}/g)?.join(' ') || val;
}

function formatExp(input) {
  let val = input.value.replace(/\D/g, '').substring(0, 4);
  if (val.length >= 3) val = val.slice(0, 2) + '/' + val.slice(2);
  input.value = val;
}

function renderCheckoutSummary() {
  const cart = getCart();
  const subtotal = getCartTotal();
  const shipping = subtotal >= 2000 ? 0 : 199;
  const tax = Math.round(subtotal * 0.18);
  const total = parseInt(localStorage.getItem('kartify-total') || subtotal + shipping + tax);

  const itemsHtml = cart.map(item => {
    const p = PRODUCTS.find(pr => pr.id === item.id);
    if (!p) return '';
    return `<div class="summary-row">
      <span>${p.emoji} ${p.name} ×${item.qty}</span>
      <span>${formatPrice(p.price * item.qty)}</span>
    </div>`;
  }).join('');

  document.getElementById('checkout-summary').innerHTML = `
    ${itemsHtml}
    <div style="height:1px;background:var(--black);margin:12px 0"></div>
    <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : formatPrice(shipping)}</span></div>
    <div class="summary-row"><span>GST (18%)</span><span>${formatPrice(tax)}</span></div>
    <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
  `;
}

function placeOrder() {
  // Basic validation
  const required = ['fname', 'lname', 'email', 'phone', 'address', 'city', 'pin'];
  for (const id of required) {
    const el = document.getElementById(id);
    if (!el.value.trim()) {
      el.style.borderColor = 'var(--red)';
      el.style.boxShadow = '4px 4px 0 var(--red)';
      el.focus();
      showToast('Please fill all required fields');
      return;
    }
    el.style.borderColor = '';
    el.style.boxShadow = '';
  }

  // Save order info for success page
  const orderId = generateOrderId();
  const orderData = {
    id: orderId,
    name: document.getElementById('fname').value + ' ' + document.getElementById('lname').value,
    email: document.getElementById('email').value,
    city: document.getElementById('city').value,
    method: selectedMethod,
    total: localStorage.getItem('kartify-total') || getCartTotal(),
    items: getCart(),
    date: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
  };
  localStorage.setItem('kartify-order', JSON.stringify(orderData));

  // Show processing animation
  const btn = document.querySelector('.place-order-btn');
  btn.textContent = 'PROCESSING…';
  btn.disabled = true;

  setTimeout(() => {
    // Clear cart
    localStorage.removeItem('kartify-cart');
    window.location.href = 'success.html';
  }, 1800);
}

renderCheckoutSummary();
</script>
</body>
</html>
